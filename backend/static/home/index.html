<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1F6FEB">
  <title>IntelliStrap — Kitchen Pantry</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="apple-touch-icon" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Nunito', 'system-ui', 'sans-serif'] },
          boxShadow: {
            card: '0 4px 16px rgba(23, 33, 43, 0.04)',
            float: '0 16px 36px rgba(31, 111, 235, 0.16)',
          },
          borderRadius: { '20': '20px', '24': '24px', '16': '16px', '12': '12px' },
        }
      }
    }
  </script>
  <style>
    :root { --blue:#1F6FEB; --blue-l:#E7F0FD; --green:#2E9E4F; --green-l:#E8F6EC; --amber:#F59E0B; --amber-l:#FEF3C7;
            --red:#E5484D; --red-l:#FEE2E2; --grey:#9AA4B2; --grey-l:#F1F4F8; --text:#17212B; --muted:#5B6776; --surface:#F7F9FC; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Nunito', system-ui, sans-serif; background: var(--surface); color: var(--text); -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .fade-in { animation: fadeIn .25s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .skeleton { background: linear-gradient(90deg, #eef2f7 25%, #f7f9fc 37%, #eef2f7 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    .jar-fill { transition: height .6s ease, background-color .3s; }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 0px); }
  </style>
</head>
<body class="min-h-screen">
  <noscript><p style="padding:24px;font-weight:700">IntelliStrap needs JavaScript to show your pantry.</p></noscript>

  <!-- ================= LOGIN ================= -->
  <div id="login" class="hidden fixed inset-0 z-[70] bg-[#F7F9FC] flex items-center justify-center p-5">
    <form id="login-form" class="w-full max-w-sm bg-white rounded-24 shadow-card border border-[#E7F0FD] p-7 space-y-5">
      <div class="flex items-center gap-3">
        <img src="/static/logo.png" alt="" class="w-11 h-11 rounded-20 object-contain">
        <div>
          <h1 class="text-2xl font-extrabold leading-none">Intelli<span class="text-[#1F6FEB]">Strap</span></h1>
          <p class="text-xs font-semibold text-[#5B6776] mt-1">Kitchen Pantry</p>
        </div>
      </div>
      <div class="space-y-2">
        <label for="login-password" class="block text-sm font-extrabold">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required
               class="w-full min-h-[52px] px-4 rounded-16 bg-[#F7F9FC] border border-[#E7F0FD] focus:border-[#1F6FEB] focus:bg-white focus:outline-none text-base font-bold">
        <p id="login-error" class="text-sm font-bold text-[#E5484D] min-h-[1.25rem]" role="alert"></p>
      </div>
      <button type="submit" class="w-full min-h-[52px] rounded-20 bg-[#1F6FEB] hover:bg-[#1858bd] text-white font-extrabold text-base shadow-float transition">Open my pantry</button>
    </form>
  </div>

  <div id="app" class="hidden min-h-screen flex flex-col">
    <!-- ================= HEADER ================= -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-[#E7F0FD] px-4 sm:px-8 pt-3 pb-3 sm:pb-3.5">
      <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
        <button type="button" data-tab="jars" class="flex items-center gap-3 text-left" aria-label="Go to My Jars">
          <img src="/static/logo.png" alt="" class="w-10 h-10 rounded-20 object-contain">
          <div>
            <h1 class="text-xl font-extrabold tracking-tight leading-none">Intelli<span class="text-[#1F6FEB]">Strap</span></h1>
            <p class="text-xs font-semibold text-[#5B6776] mt-0.5">Kitchen Pantry</p>
          </div>
        </button>
        <div class="flex items-center gap-2">
          <span id="conn-badge" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-[#F1F4F8] text-[#5B6776]"></span>
          <button id="open-settings" type="button" class="w-11 h-11 rounded-full bg-[#F7F9FC] hover:bg-[#E7F0FD] hover:text-[#1F6FEB] flex items-center justify-center transition border border-[#E7F0FD]" aria-label="Settings" title="Settings">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>
      <!-- Tabs: top on tablets and laptops; a thumb-friendly bar at the bottom on phones -->
      <nav id="top-tabs" class="hidden sm:flex max-w-4xl mx-auto mt-3.5 rounded-20 bg-[#F1F4F8] p-1.5 gap-1.5" aria-label="Sections"></nav>
    </header>

    <div id="offline-banner" class="hidden bg-[#9AA4B2] text-white text-sm font-bold px-4 py-2.5 text-center" role="status"></div>

    <!-- ================= MAIN ================= -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 pb-28 sm:pb-12">
      <section id="tab-jars" data-section="jars" class="space-y-6"></section>
      <section id="tab-list" data-section="list" class="hidden space-y-6"></section>
      <section id="tab-orders" data-section="orders" class="hidden space-y-5"></section>
    </main>

    <footer class="hidden sm:block max-w-4xl mx-auto w-full px-4 py-4 text-center text-xs font-semibold text-[#5B6776] border-t border-[#E7F0FD]/60">
      IntelliStrap &bull; Keeping your kitchen effortlessly stocked.
    </footer>

    <nav id="bottom-tabs" class="sm:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-[#E7F0FD] shadow-[0_-6px_20px_rgba(23,33,43,0.06)] pb-safe grid grid-cols-3" aria-label="Sections"></nav>
  </div>

  <!-- ================= JAR DETAIL ================= -->
  <div id="jar-modal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm items-end sm:items-center justify-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="jar-modal-title">
    <div id="jar-modal-card" class="bg-white w-full sm:max-w-md rounded-t-24 sm:rounded-24 p-6 sm:p-7 shadow-float border border-[#E7F0FD] max-h-[92vh] overflow-y-auto fade-in"></div>
  </div>

  <!-- ================= ADD A JAR ================= -->
  <div id="add-modal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm items-end sm:items-center justify-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <div id="add-card" class="bg-white w-full sm:max-w-md rounded-t-24 sm:rounded-24 p-6 sm:p-7 shadow-float border border-[#E7F0FD] max-h-[92vh] overflow-y-auto fade-in"></div>
  </div>

  <!-- ================= SETTINGS ================= -->
  <div id="settings-overlay" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm"></div>
  <aside id="settings-drawer" class="fixed top-0 right-0 bottom-0 w-full sm:w-96 bg-white z-[55] shadow-2xl flex flex-col translate-x-full transition-transform duration-300 border-l border-[#E7F0FD]" aria-label="Settings" aria-hidden="true"></aside>

  <!-- ================= TOAST ================= -->
  <div id="toast" class="fixed bottom-24 sm:bottom-6 inset-x-4 max-w-sm mx-auto z-[80] bg-[#17212B] text-white px-5 py-3.5 rounded-20 shadow-float flex items-center gap-3 transition-all duration-300 translate-y-24 opacity-0 pointer-events-none" role="status" aria-live="polite">
    <div id="toast-icon" class="w-7 h-7 rounded-full bg-[#2E9E4F] flex items-center justify-center text-xs font-bold flex-shrink-0">✓</div>
    <span id="toast-text" class="text-sm font-bold flex-1"></span>
  </div>

  <script src="/static/home/app.js"></script>
</body>
</html>
